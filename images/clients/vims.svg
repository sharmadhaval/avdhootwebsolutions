<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" width="100%" height="100%">
  <!-- Left Emblem: Family Circle & Umbrella Shield -->
  <g transform="translate(15, 10)">
    <!-- Outer Gradient Arc Shield -->
    <path d="M 12,50 A 35,35 0 0,1 68,25" fill="none" stroke="#7c3aed" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M 68,25 A 35,35 0 0,1 78,55" fill="none" stroke="#0d9488" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Umbrella top cap -->
    <path d="M 28,24 C 40,16 50,16 62,24" fill="none" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>
    <line x1="45" y1="17" x2="45" y2="12" stroke="#0284c7" stroke-width="3" stroke-linecap="round"/>

    <!-- Family Figures (3 stylized people) -->
    <!-- Person 1 (Adult Purple) -->
    <circle cx="28" cy="46" r="4.5" fill="#7c3aed"/>
    <path d="M 23,68 C 23,55 33,55 33,68" fill="none" stroke="#7c3aed" stroke-width="4" stroke-linecap="round"/>

    <!-- Person 2 (Child Green) -->
    <circle cx="40" cy="40" r="4" fill="#10b981"/>
    <path d="M 35,68 C 35,50 45,50 45,68" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round"/>

    <!-- Person 3 (Adult Blue) -->
    <circle cx="52" cy="34" r="5" fill="#2563eb"/>
    <path d="M 46,68 C 46,44 58,44 58,68" fill="none" stroke="#2563eb" stroke-width="4.5" stroke-linecap="round"/>
  </g>

  <!-- Typography: VIMS -->
  <g transform="translate(115, 78)">
    <text font-family="'Outfit', 'Nunito', sans-serif" font-weight="900" font-size="64" letter-spacing="2">
      <tspan fill="#7c3aed">V</tspan><tspan fill="#0d9488">I</tspan><tspan fill="#10b981">M</tspan><tspan fill="#2563eb">S</tspan>
    </text>
  </g>
</svg>
