<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 140" width="100%" height="100%">
  <defs>
    <linearGradient id="artGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="40%" stop-color="#e11d48"/>
      <stop offset="80%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
  </defs>

  <!-- Outer Gradient Ring Emblem -->
  <g transform="translate(10, 10)">
    <circle cx="60" cy="60" r="52" fill="none" stroke="url(#artGrad)" stroke-width="6.5" stroke-dasharray="160 15 80 15"/>
    <circle cx="60" cy="60" r="44" fill="none" stroke="#e11d48" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Inner Brush/Cursive Text inside circle graphic & text box -->
  <g transform="translate(145, 0)">
    <!-- Main Script: Art is Therapy -->
    <text x="0" y="65" font-family="'Brush Script MT', 'Dancing Script', 'Caveat', 'Segoe Script', cursive" font-weight="700" font-size="48" fill="#c026d3" letter-spacing="1">Art is</text>
    <text x="0" y="105" font-family="'Brush Script MT', 'Dancing Script', 'Caveat', 'Segoe Script', cursive" font-weight="700" font-size="44" fill="#e11d48" letter-spacing="1">Therapy</text>
    
    <!-- Subtitle: By Ronak -->
    <text x="175" y="120" font-family="'Inter', sans-serif" font-weight="700" font-size="14" fill="#475569" letter-spacing="0.5">By Ronak</text>
  </g>
</svg>
