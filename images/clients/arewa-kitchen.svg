  <!-- Hindi Script: अरेवा -->
  <text x="220" y="85" font-family="'Nirmala UI', 'Mangal', 'Kohinoor Devanagari', 'Yantramanav', sans-serif" font-weight="700" font-size="54" fill="#18181b" text-anchor="middle" letter-spacing="1">अरेवा</text>

  <!-- Subtitle: KITCHEN -->
  <text x="220" y="118" font-family="'Inter', 'Montserrat', sans-serif" font-weight="600" font-size="16" fill="#27272a" text-anchor="middle" letter-spacing="6">KITCHEN</text>
