<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 120" width="100%" height="100%">
  <defs>
    <linearGradient id="samarthBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Left Icon: Stylized Samarth 'S' with Magnifying Lens -->
  <g transform="translate(10, 10)">
    <!-- S Flow Wave -->
    <path d="M 45,15 C 20,15 10,32 22,48 C 34,64 68,52 65,75 C 62,95 28,95 12,80" fill="none" stroke="url(#samarthBlue)" stroke-width="14" stroke-linecap="round"/>
    <!-- Magnifying Glass Lens -->
    <circle cx="35" cy="55" r="22" fill="#ffffff" stroke="url(#samarthBlue)" stroke-width="5"/>
    <circle cx="35" cy="55" r="17" fill="url(#lensGrad)" opacity="0.25"/>
    <!-- Handle -->
    <path d="M 20,70 L 8,82" stroke="url(#samarthBlue)" stroke-width="6" stroke-linecap="round"/>
    <!-- Cell/Drop dots -->
    <circle cx="32" cy="52" r="3.5" fill="#10b981"/>
    <circle cx="40" cy="58" r="2.5" fill="#0284c7"/>
    <circle cx="37" cy="47" r="2" fill="#f59e0b"/>
  </g>

  <!-- Brand Typography -->
  <text x="110" y="68" font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="800" font-size="52" fill="#0284c7" letter-spacing="-0.5">Samarth</text>
  <text x="298" y="78" font-family="'Inter', sans-serif" font-weight="600" font-size="11" fill="#0369a1" letter-spacing="1.2">PATHOLOGY LABORATORY</text>
</svg>
